<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moniteur de Température ESP32</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importation de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="card">
        <h1>Température ESP32</h1>
        
        <div class="temp-display">
            <span id="valeur-temp">--</span> <span class="unit">°C</span>
        </div>

        <p id="statut">Connexion en cours...</p>

        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <!-- Script principal placé juste avant la fermeture du body -->
    <script src="script.js"></script>
</body>
</html>
